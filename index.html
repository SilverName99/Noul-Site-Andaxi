      // Aplică tema salvată înainte de prima randare, ca să nu clipească culorile.
      // Implicit (prima vizită): tema întunecată.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('andaxi-theme') === 'brand' ? 'brand' : 'blue'
      } catch (e) {
        document.documentElement.dataset.theme = 'blue'
      }
    </script>
